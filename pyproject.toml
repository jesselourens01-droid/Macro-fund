[project]
name = "jlmacro"
version = "0.1.0"
description = "JL Global Macro Investment Platform - institutional-grade macro hedge fund research, risk and portfolio management system"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pandas-market-calendars>=4.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "streamlit>=1.38",
    "plotly>=5.24",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.1",
    "lightgbm>=4.5",
]
opt = [
    "cvxpy>=1.5",
]
polars = [
    "polars>=1.9",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: flags Depends()/Query() as default args, which is the standard, documented
# FastAPI dependency-injection pattern (see src/jlmacro/api/routers/*) - not a real bug.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
