# Definitions of macro indicators tracked per country. Used by data adapters (Phase 2)
# and the regime engine (Phase 3) to know what to fetch/compute and how to categorise it.

countries:
  - US
  - EA
  - GB
  - JP
  - AU
  - CN

indicators:
  growth:
    - code: PMI_MFG
      name: "Manufacturing PMI"
      frequency: monthly
    - code: PMI_SERVICES
      name: "Services PMI"
      frequency: monthly
    - code: INDUSTRIAL_PRODUCTION
      name: "Industrial Production"
      frequency: monthly
    - code: RETAIL_SALES
      name: "Retail Sales"
      frequency: monthly
    - code: GDP
      name: "Gross Domestic Product"
      frequency: quarterly
    - code: CONSUMER_CONFIDENCE
      name: "Consumer Confidence"
      frequency: monthly
    - code: EMPLOYMENT
      name: "Employment / Payrolls"
      frequency: monthly

  inflation:
    - code: CPI_HEADLINE
      name: "Headline CPI"
      frequency: monthly
    - code: CPI_CORE
      name: "Core CPI"
      frequency: monthly
    - code: PCE
      name: "Personal Consumption Expenditures Price Index"
      frequency: monthly
      countries: [US]
    - code: WAGE_GROWTH
      name: "Wage Growth"
      frequency: quarterly
    - code: PPI
      name: "Producer Price Index"
      frequency: monthly
    - code: BREAKEVEN_INFLATION
      name: "Breakeven Inflation Rate"
      frequency: daily

  monetary_policy:
    - code: POLICY_RATE
      name: "Central Bank Policy Rate"
      frequency: daily
    - code: YIELD_CURVE_SLOPE
      name: "2s10s Yield Curve Slope"
      frequency: daily
    - code: RATE_EXPECTATIONS
      name: "Rate Expectations (OIS-implied)"
      frequency: daily

  financial_conditions:
    - code: CREDIT_SPREAD_IG
      name: "Investment Grade Credit Spread"
      frequency: daily
    - code: CREDIT_SPREAD_HY
      name: "High Yield Credit Spread"
      frequency: daily
    - code: EQUITY_VOL
      name: "Equity Implied Volatility"
      frequency: daily
    - code: BOND_VOL
      name: "Bond Implied Volatility (MOVE-style)"
      frequency: daily
    - code: MONEY_SUPPLY
      name: "Broad Money Supply Growth"
      frequency: monthly

sources:
  - FRED
  - US_TREASURY
  - FEDERAL_RESERVE
  - RBA
  - ABS
  - ECB
  - BOE
  - BOJ
  - WORLD_BANK
  - IMF
  - SYNTHETIC   # Phase 1 placeholder source used until real adapters (Phase 2) are wired in

# Maps our internal (country, indicator_code) pairs onto each real provider's own
# series/table identifiers, so the adapters (src/jlmacro/data/macro/{fred,rba,abs}.py)
# never hard-code a series ID - add/change a mapping here, no code changes needed.
#
# FRED IDs below are FRED's standard, stable series mnemonics (fred.stlouisfed.org).
#
# RBA entries marked "VERIFY" are the current table/series identifiers as best known at
# the time this was written - this environment's network policy blocked a live call to
# rba.gov.au to confirm them; RBA occasionally renumbers tables and series codes, so
# confirm before relying on them. ABS's CPI_HEADLINE mapping below was checked against
# ABS's own published Data API documentation (search-accessible even though the API
# itself wasn't reachable from here) and matches a worked example straight from ABS's
# docs, so it is on firmer footing than the RBA entries, though still not live-tested
# end to end - see the comment on it for sources. Either way, treat
# RBAProvider/ABSProvider's parsing logic (tested against realistic fixtures) as the
# trustworthy part of this system, these identifiers as the part to double-check.
provider_series_ids:
  FRED:
    US:
      CPI_HEADLINE: CPIAUCSL
      CPI_CORE: CPILFESL
      PCE: PCEPI
      PPI: PPIACO
      RETAIL_SALES: RSAFS
      INDUSTRIAL_PRODUCTION: INDPRO
      GDP: GDP
      CONSUMER_CONFIDENCE: UMCSENT
      EMPLOYMENT: PAYEMS
      WAGE_GROWTH: CES0500000003
      POLICY_RATE: FEDFUNDS
      YIELD_CURVE_SLOPE: T10Y2Y
      CREDIT_SPREAD_IG: BAMLC0A0CM
      CREDIT_SPREAD_HY: BAMLH0A0HYM2
      EQUITY_VOL: VIXCLS
      MONEY_SUPPLY: M2SL
      BREAKEVEN_INFLATION: T10YIE

  RBA:
    AU:
      # VERIFY: RBA Table F1 "Interest Rates" - cash rate target column.
      POLICY_RATE:
        csv_url: "https://www.rba.gov.au/statistics/tables/csv/f01d.csv"
        series_id: "FIRMMCRTD"
      # VERIFY: RBA Table G1 "Consumer Price Inflation" - headline CPI, y/y.
      CPI_HEADLINE:
        csv_url: "https://www.rba.gov.au/statistics/tables/csv/g01d.csv"
        series_id: "GCPIAGYP"

  ABS:
    AU:
      # Verified against ABS's own published documentation (still not live-tested end
      # to end - this sandbox's network policy blocks api.data.abs.gov.au, see below):
      # dataflow syntax is "{agencyId},{dataflowId},{version}" per ABS's Data API user
      # guide ("Using the API"), and "ABS,CPI,2.0.0"/"1.10001.10.50.M" is a worked
      # example straight from ABS's own "Worked Examples" page (All groups CPI,
      # Australia) - see
      # https://www.abs.gov.au/statistics/application-programming-interfaces-apis/data-api-user-guide/worked-examples
      # and https://www.abs.gov.au/statistics/application-programming-interfaces-apis/data-api-user-guide/using-api.
      # Still do one live request before depending on this: dimension-code meanings
      # (e.g. the "10"/"50" positions) were not independently confirmed, only that this
      # exact key string appears in ABS's own docs as a valid CPI query.
      CPI_HEADLINE:
        dataflow: "ABS,CPI,2.0.0"
        key: "1.10001.10.50.M"
      # GDP: the dataflow ID "ANA_AGG" (Australian National Accounts aggregates:
      # GDP, GDP per capita, terms of trade, real income) is confirmed via ABS/AGA
      # documentation, but no verified example *data key* (dimension values) for it
      # could be found without a live call to ABS's dataflow/datastructure endpoints
      # (blocked from this sandbox) - deliberately left unmapped rather than guessing
      # a key. To add it: call
      # https://data.api.abs.gov.au/rest/datastructure/ABS/ANA_AGG?references=all
      # (or the dataflow's own structure endpoint) to get the real dimension list and
      # codelists, then set dataflow: "ABS,ANA_AGG,<version>" and the matching key here.
