# Stress-test scenario definitions (used by src/jlmacro/risk stress engine, Phase 6+).

historical_scenarios:
  - id: GFC_2008
    name: "2008 Global Financial Crisis"
    start_date: "2008-09-01"
    end_date: "2009-03-01"
  - id: EURO_CRISIS_2011
    name: "2011 Euro Crisis"
    start_date: "2011-07-01"
    end_date: "2011-12-01"
  - id: TAPER_TANTRUM_2013
    name: "2013 Taper Tantrum"
    start_date: "2013-05-01"
    end_date: "2013-09-01"
  - id: CHINA_SHOCK_2015
    name: "2015 China Shock"
    start_date: "2015-06-01"
    end_date: "2015-09-01"
  - id: VOL_SHOCK_2018
    name: "2018 Volatility Shock (Volmageddon)"
    start_date: "2018-01-01"
    end_date: "2018-03-01"
  - id: COVID_2020
    name: "2020 COVID Crash"
    start_date: "2020-02-01"
    end_date: "2020-04-01"
  - id: INFLATION_SHOCK_2022
    name: "2022 Inflation / Rates Shock"
